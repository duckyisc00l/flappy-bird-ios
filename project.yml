name: FlappyBird
options:
  bundleIdPrefix: com.jordanvalladares
  deploymentTarget:
    iOS: "16.0"
targets:
  FlappyBird:
    type: application
    platform: iOS
    sources:
      - path: ios/Engine                  # the website's game, ported to Swift line by line
      - path: ios/UI                      # the website's menus, in SwiftUI
      - path: App/Assets.xcassets          # app icon
      - path: tv/Resources/fonts
      - path: ios/Resources/web            # the website's pictures, birds, sounds and data
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Flappy Bird
        CFBundleShortVersionString: "6.1"
        CFBundleVersion: "157"
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIAppFonts: [inside.ttf, outside.ttf, pixel.ttf]
        CFBundleURLTypes:
          - CFBundleURLName: flappybird
            CFBundleURLSchemes: [flappybird]
        NSPhotoLibraryAddUsageDescription: Save your score card and replay clips to Photos.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jordanvalladares.flappybird
        PRODUCT_NAME: FlappyBird
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
