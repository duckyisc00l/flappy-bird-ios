name: FlappyBird
options:
  bundleIdPrefix: com.jordanvalladares
  deploymentTarget:
    iOS: "16.0"
targets:
  FlappyBird:
    type: application
    platform: iOS
    sources:
      - path: ios/Engine                  # the website's game, ported to Swift line by line
      - path: ios/UI                      # the website's menus, in SwiftUI
      - path: ios/Shared                  # shared with the Home Screen widget
      - path: App/Assets.xcassets          # app icon
      - path: ios/Resources/fonts
      - path: ios/Resources/web            # the website's pictures, birds, sounds and data
        type: folder
        buildPhase: resources
    dependencies:
      - target: FlappyBirdWidget          # v156: the Home Screen widget (embedded in the app)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Flappy Bird
        CFBundleShortVersionString: "6.2"
        CFBundleVersion: "181"
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        CADisableMinimumFrameDurationOnPhone: true   # v157: lets ProMotion iPhones run the game at 120 fps
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIAppFonts: [inside.ttf, outside.ttf, pixel.ttf]
        CFBundleURLTypes:
          - CFBundleURLName: flappybird
            CFBundleURLSchemes: [flappybird]
        NSPhotoLibraryAddUsageDescription: Save your score card and replay clips to Photos.
        NSLocationWhenInUseUsageDescription: So the game's weather matches the weather where you are. Your location is rounded to about 1 km and only used to look up the weather.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jordanvalladares.flappybird
        PRODUCT_NAME: FlappyBird
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_ENTITLEMENTS: App/FlappyBird.entitlements   # (applied by the build's ad-hoc signing step)
  FlappyBirdWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ios/Widget
        excludes: [Info.plist, Widget.entitlements]
      - path: ios/Shared
      - path: ios/Resources/fonts
    info:
      path: ios/Widget/Info.plist
      properties:
        CFBundleDisplayName: Flappy Bird
        CFBundleShortVersionString: "6.2"
        CFBundleVersion: "181"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts: [inside.ttf, outside.ttf, pixel.ttf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jordanvalladares.flappybird.widget
        PRODUCT_NAME: FlappyBirdWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_ENTITLEMENTS: ios/Widget/Widget.entitlements
