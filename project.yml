name: FlappyBird
options:
  bundleIdPrefix: com.jordanvalladares
  deploymentTarget:
    iOS: "15.0"
targets:
  FlappyBird:
    type: application
    platform: iOS
    sources:
      - path: ios/Sources                 # the iPhone screens (SwiftUI)
      - path: tv/Sources/GameScene.swift   # the game itself, shared with the Apple TV app
      - path: tv/Sources/Birds.swift
      - path: tv/Sources/Trails.swift
      - path: tv/Sources/Seasons.swift
      - path: tv/Sources/Prefs.swift
      - path: tv/Sources/Online.swift
      - path: tv/Sources/Account.swift
      - path: tv/Sources/Realtime.swift
      - path: tv/Sources/Rumble.swift
      - path: App/Assets.xcassets          # app icon + the game's sprites
      - path: tv/Resources/sounds
      - path: tv/Resources/fonts
      - path: tv/Resources/birds
        type: folder
        buildPhase: resources
      - path: tv/Resources/season
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Flappy Bird
        CFBundleShortVersionString: "6.0"
        CFBundleVersion: "149"
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIAppFonts: [inside.ttf, outside.ttf, pixel.ttf]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jordanvalladares.flappybird
        PRODUCT_NAME: FlappyBird
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
