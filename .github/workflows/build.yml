name: Build Flappy Bird IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore: [ 'tv/TopShelf/**', '.github/workflows/tv.yml' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Make the Xcode project
        run: |
          xcodegen generate
          # SideStore (and older AltStore) only look at the version to spot an update, so each build gets its own:
          # 6.2 + build 168 -> 6.2.168
          PL=App/Info.plist
          V=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" $PL); B=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" $PL)
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V.$B" $PL
          echo "version $V.$B ($B)"
      - name: Build the app (unsigned)
        run: |
          mkdir -p out
          xcodebuild -project FlappyBird.xcodeproj -scheme FlappyBird -sdk iphoneos -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -derivedDataPath build build > out/build.log 2>&1 || { grep -E "error:" out/build.log | sort -u | head -60 > out/errors.txt; cat out/errors.txt; echo FAILED > out/status.txt; exit 0; }
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/FlappyBird.app Payload/
          zip -qry FlappyBird.ipa Payload && cp FlappyBird.ipa out/
          echo BUILT > out/status.txt
          grep -E "warning:" out/build.log | grep -v "/build/" | sort -u | head -40 > out/warnings.txt || true
      - name: Run in the iPhone simulator and take screenshots
        if: ${{ hashFiles('FlappyBird.ipa') != '' }}
        run: |
          xcodebuild -project FlappyBird.xcodeproj -scheme FlappyBird -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild build > out/simbuild.log 2>&1 || { echo SIMFAILED >> out/status.txt; exit 0; }
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[5-7]( Pro)? \(" | head -1 | grep -oE '[0-9A-F-]{36}')
          [ -z "$UDID" ] && UDID=$(xcrun simctl list devices available | grep -i "iPhone" | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "sim $UDID"; xcrun simctl list devices available | grep -i iphone | head -3 > out/sims.txt
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b > /dev/null
          APP=$(find simbuild/Build/Products -name "FlappyBird.app" -path "*simulator*" | head -1)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p out/shots
          xcrun simctl launch --console-pty "$UDID" com.jordanvalladares.flappybird -shots > out/console.txt 2>&1 &
          # the app saves its own screenshots to Documents/shots and writes "DEMO end" to Documents/demo.txt when done
          DATA=$(xcrun simctl get_app_container "$UDID" com.jordanvalladares.flappybird data); F="$DATA/Documents/demo.txt"; echo "data $DATA"
          for t in $(seq 1 900); do sleep 0.5; [ -f "$F" ] && grep -q "DEMO end" "$F" && break; done
          xcrun simctl io "$UDID" screenshot out/shots/zz_last.png > /dev/null 2>&1 || true
          cp "$DATA"/Documents/shots/*.png out/shots/ 2>/dev/null || true
          cp "$F" out/demo.txt 2>/dev/null || true
          xcrun simctl terminate "$UDID" com.jordanvalladares.flappybird || true
          grep DEMO out/console.txt | head -30 || true
      - name: Publish the IPA, a GitHub release and the SideStore source
        if: ${{ hashFiles('FlappyBird.ipa') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          PL=build/Build/Products/Release-iphoneos/FlappyBird.app/Info.plist
          VER=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$PL")
          BLD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$PL")
          TAG="ios-$BLD"; NOTE1=$(printf '%s' "$NOTES" | head -1)
          # one release per build number (the SideStore source points at it)
          if gh release view "$TAG" > /dev/null 2>&1; then gh release upload "$TAG" FlappyBird.ipa --clobber
          else gh release create "$TAG" FlappyBird.ipa --title "iPhone $VER ($BLD)" --notes "${NOTE1:-Build $BLD}" --latest; fi
          # keep the 6 newest iPhone releases
          gh release list --limit 100 --json tagName,createdAt -q '[.[] | select(.tagName | startswith("ios-"))] | sort_by(.createdAt) | reverse | .[6:] | .[].tagName' \
            | while read -r t; do gh release delete "$t" --yes --cleanup-tag || true; done
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/FlappyBird.ipa"
          mkdir -p ipaout/shots && cp FlappyBird.ipa ipaout/
          sips -Z 512 App/Assets.xcassets/AppIcon.appiconset/icon-1024.png --out ipaout/icon.png > /dev/null
          SH=""
          for n in title play2 pipes_halloween over2 card weather; do
            f=$(ls out/shots/*_$n.png 2> /dev/null | head -1)
            if [ -n "$f" ]; then sips -Z 1400 "$f" --out "ipaout/shots/$n.png" > /dev/null; SH="$SH $n.png"; fi
          done
          python3 scripts/make_source.py ipaout/source.json FlappyBird.ipa "$VER" "$BLD" "$URL" "$NOTE1" $SH
          cp ipaout/source.json out/source.json
          cd ipaout
          git init -q; git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b ipa; git add -A; git commit -qm "FlappyBird.ipa + SideStore source from build ${{ github.run_number }} ($VER $BLD)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ipa
      - name: Save the results to the 'ios-build' branch
        if: always()
        run: |
          cd out; rm -f FlappyBird.ipa build.log simbuild.log
          git init -q; git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b ios-build; git add -A; git commit -qm "iPhone build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ios-build
