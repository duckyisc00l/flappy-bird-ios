name: Build Flappy Bird IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Make the Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version && xcodebuild -showsdks | grep -i ios || true

      - name: Build the app (unsigned)
        run: |
          xcodebuild -project FlappyBird.xcodeproj \
            -scheme FlappyBird \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -derivedDataPath build \
            build > build.log 2>&1 || {
              echo "Build failed. Errors:"
              grep -E "error:|Error:|fatal|exit code" build.log | head -10 | while IFS= read -r l; do echo "::error::$l"; done
              tail -10 build.log | while IFS= read -r l; do echo "::warning::$l"; done
              exit 1
            }
          tail -5 build.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FlappyBird.app Payload/
          zip -qry FlappyBird.ipa Payload
          ls -la FlappyBird.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBird-ipa
          path: FlappyBird.ipa

      - name: Save IPA to the 'ipa' branch
        run: |
          mkdir out && cp FlappyBird.ipa out/
          cd out
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b ipa
          git add FlappyBird.ipa
          git commit -qm "FlappyBird.ipa from build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ipa
